name: Simplify release assets
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to simplify
        required: true
        default: v1.20.5
permissions:
  contents: write
jobs:
  simplify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Keep setup packages and updater metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          mkdir packages
          cd packages
          gh release download "$RELEASE_TAG" --pattern GDH_Search_Setup.zip --pattern "GDH_Search_Setup_${RELEASE_TAG}.zip" --pattern gdh-release.json
          cmp GDH_Search_Setup.zip "GDH_Search_Setup_${RELEASE_TAG}.zip"
          sha256sum GDH_Search_Setup.zip "GDH_Search_Setup_${RELEASE_TAG}.zip" > "SHA256SUMS_${RELEASE_TAG}.txt"
          gh release upload "$RELEASE_TAG" "SHA256SUMS_${RELEASE_TAG}.txt" --clobber
          for asset in "CNC_Machine_Viewer_${RELEASE_TAG}.zip" "GDH_Search_Extension_${RELEASE_TAG}.zip"; do
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | rg -Fx "$asset"; then
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done
