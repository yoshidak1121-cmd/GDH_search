name: Smoke tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/export-results.cjs
      - run: node tests/getdata.cjs
      - run: node tests/english-headers.cjs
      - run: node tests/smoke.cjs
      - run: node tests/countries.cjs

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build-extension.cjs
      - run: node tests/reference.cjs
      - run: node tests/facets.cjs
      - run: node tests/duplicates.cjs
      - run: node tests/i18n.cjs
      - run: node tests/english-headers-browser.cjs
      - run: node tests/export-results-browser.cjs
      - run: node tests/navigation.cjs
      - run: node tests/dashboard.cjs
      - run: node tests/gdh-export.cjs
      - run: node tests/extension.cjs
